name: Build CLI package

# Manual only, no inputs: press Run and it builds the CLI tarball, publishes it
# to GitHub Packages (npm) and overwrites the asset on the `cli-latest` release.
#
# Why both: the npm registry on GitHub refuses to republish an existing version
# (E409) and demands a token even for public packages. So the published version
# is suffixed with the run number and tagged `latest` — the package page always
# shows the newest build — while the release asset stays the token-free install
# path for the containers already using it:
#
#   npm install -g https://github.com/<owner>/<repo>/releases/download/cli-latest/9router-latest.tgz
on:
  workflow_dispatch:

# One build at a time: the build mutates package.json (version sync) and two
# runs would race to clobber the same release asset.
concurrency:
  group: cli-package-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_TAG: cli-latest

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` and no `cache: npm`: package-lock.json is gitignored in this
      # repo (.gitignore:63), so there is no lockfile on a fresh checkout.
      #
      # Root deps first: cli/scripts/build-cli.js shells out to `npm run build`
      # in the repo root to produce the Next.js standalone bundle it packages.
      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        run: npm --prefix cli install --no-audit --no-fund

      - name: Build and pack
        id: pack
        run: |
          npm --prefix cli run pack:cli
          version=$(node -p "require('./cli/package.json').version")
          cp "9router-$version.tgz" 9router-latest.tgz
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 9router-cli-${{ steps.pack.outputs.version }}
          path: 9router-latest.tgz
          if-no-files-found: error

      # Scoped copy: GitHub Packages only accepts @<owner>/* names, and the
      # version gets a per-run suffix because the registry cannot overwrite an
      # existing version. prepublishOnly would re-run the whole build.
      - name: Stage scoped copy
        id: stage
        run: |
          mkdir -p staging
          tar -xzf 9router-latest.tgz -C staging
          published=$(node -e '
            const fs = require("fs");
            const f = "staging/package/package.json";
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            p.name = "@${{ github.repository_owner }}/9router".toLowerCase();
            p.version = `${p.version}-build.${{ github.run_number }}`;
            p.publishConfig = { registry: "https://npm.pkg.github.com" };
            p.repository = { type: "git", url: "git+${{ github.server_url }}/${{ github.repository }}.git" };
            delete p.scripts.prepublishOnly;
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            process.stdout.write(p.name + "@" + p.version);
          ')
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "Publishing $published"

      # github.token is enough: the package is owned by this repo. --ignore-scripts
      # keeps the postinstall warm-up from running on the runner.
      - name: Publish to GitHub Packages
        working-directory: staging/package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm publish --ignore-scripts --tag latest

      # --clobber overwrites the asset in place, so the download URL never
      # changes. --latest=false keeps this rolling build from stealing the
      # "Latest" badge from real version releases.
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Rolling build of the 9Router CLI — overwritten by every run of this workflow.

            version: `${{ steps.pack.outputs.version }}`
            commit: ${{ github.sha }}

            Token-free install (public repo):

            ```bash
            npm install -g ${{ github.server_url }}/${{ github.repository }}/releases/download/cli-latest/9router-latest.tgz
            ```

            Same build on GitHub Packages (needs a `read:packages` token in `.npmrc`):

            ```bash
            npm install -g ${{ steps.stage.outputs.published }}
            ```
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "9Router CLI — rolling build" \
              --notes "$NOTES" \
              --latest=false
          gh release upload "$RELEASE_TAG" 9router-latest.tgz --clobber
          gh release edit "$RELEASE_TAG" --notes "$NOTES"

      - name: Summary
        run: |
          {
            echo "### 9Router CLI"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| GitHub Packages | \`${{ steps.stage.outputs.published }}\` (dist-tag \`latest\`) |"
            echo "| Release asset   | \`${{ env.RELEASE_TAG }}/9router-latest.tgz\` |"
          } >> "$GITHUB_STEP_SUMMARY"
